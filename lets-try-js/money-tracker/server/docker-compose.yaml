services:
  money-tracker-postgres:
    image: postgres:18.3-bookworm
    container_name: money-tracker-container-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: money-tracker-postgress-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:money-tracker-postgres:5432
    ports:
      - "127.0.0.1:5431:5432"
